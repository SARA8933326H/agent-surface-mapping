name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/surface?schema=public
  REDIS_URL: redis://localhost:6379
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  CORS_ORIGIN: http://localhost:3000
  NEXT_PUBLIC_API_URL: http://localhost:3001
  NEXT_PUBLIC_API_KEY: ''
  ALLOW_PRIVATE_TARGETS: 'true'
  VULN_CHECKS_ENABLED: 'true'
  VULN_ACTIVE_PROBES: 'true'
  VULN_PROBE_TIMEOUT: '5000'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify pnpm version
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @surface/shared build
          pnpm --filter @surface/crawler build
          pnpm --filter @surface/classifier build
          pnpm --filter @surface/reports build
          pnpm --filter @surface/backend db:generate
          pnpm --filter @surface/backend build

      - name: Typecheck backend
        run: pnpm --filter @surface/backend typecheck

      - name: Test classifier
        run: pnpm --filter @surface/classifier test -- --ci --runInBand

      - name: Test backend
        run: pnpm --filter @surface/backend test -- --ci --runInBand

      - name: Build frontend
        run: pnpm --filter @surface/frontend build

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            backend/dist
            frontend/.next
            pnpm-lock.yaml
          retention-days: 3
