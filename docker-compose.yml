version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: surface
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/surface?schema=public
      REDIS_URL: redis://redis:6379
      SCREENSHOT_DIR: /app/screenshots
      REPORT_DIR: /app/reports-output
    volumes:
      - screenshots:/app/screenshots
      - reports:/app/reports-output
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ['pnpm', '--filter', '@surface/backend', 'worker']
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/surface?schema=public
      REDIS_URL: redis://redis:6379
      SCREENSHOT_DIR: /app/screenshots
      REPORT_DIR: /app/reports-output
    volumes:
      - screenshots:/app/screenshots
      - reports:/app/reports-output
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - backend

volumes:
  postgres-data:
  screenshots:
  reports:
